<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhileAI 群組</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --faint: #9a9a94;
    --line: #e4e4df; --accent: #2f6fed; --accent-soft: #e8efff; --ok: #1f9d55; --warn-soft: #fff4e0;
    --bar: #d9d9d3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #20201e; --text: #ededea; --muted: #a3a39d; --faint: #75756f;
      --line: #33332f; --accent: #6b9bff; --accent-soft: #24304a; --ok: #4cc283; --warn-soft: #3a3020;
      --bar: #3a3a36;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
  header.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  header.top a { color: var(--text); text-decoration: none; font-weight: 700; font-size: 17px; }
  header.top .who { color: var(--muted); font-size: 13px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 28px 0 10px; color: var(--muted); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .muted { color: var(--muted); } .faint { color: var(--faint); font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
                  border-radius: 10px; padding: 9px 12px; width: 100%; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer;
           background: var(--accent); color: #fff; font-weight: 600; }
  button.ghost { background: transparent; color: var(--accent); padding: 6px 8px; }
  button.secondary { background: var(--accent-soft); color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .opt { display: block; width: 100%; text-align: left; background: var(--bg); color: var(--text);
         border: 1px solid var(--line); font-weight: 500; margin-top: 8px; }
  .opt:hover { border-color: var(--accent); }
  .group-link { display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: inherit; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
  .badge.done { background: transparent; color: var(--ok); padding: 0; }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 3px 0 9px; }
  .bar > i { display: block; height: 100%; background: var(--bar); border-radius: 99px; }
  .bar.mine > i { background: var(--accent); }
  .q-meta { font-size: 12px; color: var(--faint); margin-bottom: 6px; }
  .q-text { font-weight: 650; font-size: 16px; margin-bottom: 4px; }
  .hint { background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
  .invite { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1px; }
  .opts-edit .row { flex-wrap: nowrap; margin-bottom: 8px; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); margin-top: 4px; }
  .check input { width: auto; }
  .scale { display: flex; gap: 6px; } .scale .opt { text-align: center; font-weight: 700; margin-top: 8px; }
  textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
             border-radius: 10px; padding: 9px 12px; width: 100%; resize: vertical; min-height: 64px; margin-top: 8px; }
  .named { color: #d9822b; } .voters { font-size: 12px; color: var(--muted); margin: -4px 0 8px; }
  .answer { background: var(--bg); border-radius: 10px; padding: 8px 12px; margin-top: 6px; }
  canvas.pad, canvas.dv { width: 100%; aspect-ratio: 10 / 7; background: #fff; border-radius: 10px;
                          border: 1px solid var(--line); display: block; }
  canvas.pad { touch-action: none; cursor: crosshair; margin-top: 8px; }
  .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .gallery.one { grid-template-columns: 1fr; }
  .tools { display: flex; gap: 6px; align-items: center; margin: 8px 0; }
  .dot { width: 22px; height: 22px; border-radius: 50%; padding: 0; border: 2px solid var(--line); }
  .dot.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .tools .ghost.on { background: var(--accent-soft); }
  .error { color: #d64545; font-size: 13px; min-height: 1em; margin-top: 6px; }
  .tabs { display: flex; gap: 4px; margin: 20px 0 4px; }
  .tabs button { background: transparent; color: var(--muted); padding: 6px 12px; }
  .tabs button.on { background: var(--card); color: var(--text); border: 1px solid var(--line); }
</style>
</head>
<body>
<main id="app"><p class="muted">載入中…</p></main>
<script>
const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 本機只存一組隨機 token（身分），讀寫失敗時退回記憶體
let memToken = null;
const tokenStore = {
  get() { try { return localStorage.getItem('whileai_token') || memToken; } catch { return memToken; } },
  set(t) { memToken = t; try { localStorage.setItem('whileai_token', t); } catch {} },
};

async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  const t = tokenStore.get();
  if (t) headers.Authorization = 'Bearer ' + t;
  const r = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.error || '發生錯誤'), { status: r.status });
  return data;
}

function go(path) { history.pushState(null, '', path); render(); }
window.addEventListener('popstate', render);
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-nav]');
  if (a) { e.preventDefault(); go(a.getAttribute('href')); }
});

function timeLeft(ts) {
  const s = ts - Date.now() / 1000;
  if (s <= 0) return '已截止';
  if (s < 3600) return `剩 ${Math.ceil(s / 60)} 分鐘`;
  if (s < 86400) return `剩 ${Math.round(s / 3600)} 小時`;
  return `剩 ${Math.round(s / 86400)} 天`;
}

let me = null;

async function render() {
  const url = new URL(location.href);

  // App 送來的一次性登入碼：換成網頁自己的 token 後，立刻從網址移除
  const handoff = url.searchParams.get('handoff');
  if (handoff) {
    try { const r = await api('POST', '/api/handoff/redeem', { code: handoff }); tokenStore.set(r.token); }
    catch (e) { alert(e.message); }
    url.searchParams.delete('handoff');
    history.replaceState(null, '', url.pathname + url.search);
  }

  me = null;
  if (tokenStore.get()) {
    try { me = await api('GET', '/api/me'); } catch (e) { if (e.status !== 401) throw e; }
  }

  const path = location.pathname;
  let m;
  if ((m = path.match(/^\/j\/([A-Za-z0-9]+)$/))) return renderJoin(m[1].toUpperCase());
  if (!me) return renderOnboarding();
  if ((m = path.match(/^\/g\/(\d+)$/))) return renderGroup(+m[1]);
  return renderHome();
}

function topBar() {
  return `<header class="top"><a href="/" data-nav>⏳ WhileAI</a>
    ${me ? `<span class="who">${esc(me.user.name)}</span>` : ''}</header>`;
}

function nameField(id = 'name') {
  return `<input id="${id}" maxlength="24" placeholder="你的暱稱（出題時會顯示）" autocomplete="nickname">`;
}

async function ensureUser(name) {
  if (me) return;
  const r = await api('POST', '/api/users', { name });
  tokenStore.set(r.token);
  me = await api('GET', '/api/me');
}

// ---------- 首次使用 ----------
function renderOnboarding() {
  $app.innerHTML = `${topBar()}
    <h1>在等 AI 的空檔，問問你的同伴</h1>
    <p class="muted">建立群組、互相出題。題目會在大家等 Codex 時出現，答案完全匿名。</p>
    <div class="card">${nameField()}
      <div class="row" style="margin-top:10px"><button id="start">開始</button></div>
      <div class="error" id="err"></div></div>
    <p class="faint">免註冊：我們只在這個瀏覽器存一組隨機身分碼。</p>`;
  document.getElementById('start').onclick = async () => {
    try { await ensureUser(document.getElementById('name').value); render(); }
    catch (e) { document.getElementById('err').textContent = e.message; }
  };
}

// ---------- 首頁：我的群組 ----------
function renderHome() {
  const groups = me.groups;
  $app.innerHTML = `${topBar()}
    <h1>我的群組</h1>
    ${groups.length ? '' : '<p class="muted">還沒有群組。建立一個，把邀請連結貼給同事。</p>'}
    ${groups.map(g => `<a class="card group-link" href="/g/${g.id}" data-nav>
        <span><b>${esc(g.name)}</b><br><span class="faint">${g.member_count} 人${g.muted ? ' · 已靜音' : ''}</span></span>
        <span class="muted">→</span></a>`).join('')}
    <h2>建立新群組</h2>
    <div class="card"><div class="row" style="flex-wrap:nowrap">
      <input id="gname" maxlength="40" placeholder="例如：後端組、某某社群">
      <button id="create" style="white-space:nowrap">建立</button></div>
      <div class="error" id="err"></div></div>
    <h2>有邀請碼？</h2>
    <div class="card"><div class="row" style="flex-wrap:nowrap">
      <input id="code" maxlength="8" placeholder="8 碼邀請碼" class="invite">
      <button class="secondary" id="join" style="white-space:nowrap">加入</button></div></div>`;
  document.getElementById('create').onclick = async () => {
    try { const r = await api('POST', '/api/groups', { name: document.getElementById('gname').value }); go('/g/' + r.group.id); }
    catch (e) { document.getElementById('err').textContent = e.message; }
  };
  document.getElementById('join').onclick = () => {
    const c = document.getElementById('code').value.trim();
    if (c) go('/j/' + c.toUpperCase());
  };
}

// ---------- 邀請頁 ----------
async function renderJoin(code) {
  let info;
  try { info = await api('GET', '/api/invites/' + code); }
  catch (e) { $app.innerHTML = `${topBar()}<div class="card">${esc(e.message)}</div>`; return; }
  const already = me && me.groups.find(g => g.invite_code === code);
  if (already) return go('/g/' + already.id);
  $app.innerHTML = `${topBar()}
    <p class="muted">你被邀請加入</p>
    <h1>${esc(info.name)}</h1>
    <p class="muted">${info.member_count} 位成員 · 互相出題，答案匿名</p>
    <div class="card">
      ${me ? '' : nameField()}
      <div class="row" style="margin-top:10px">
        <button id="join">用網頁加入</button>
        <a href="whileai://join/${esc(code)}"><button class="secondary" type="button">在 WhileAI App 中加入</button></a>
      </div>
      <div class="error" id="err"></div>
    </div>
    <p class="faint">裝了 WhileAI 的 Mac App，題目會在你等 Codex 的空檔自動出現，不必打開網頁。</p>`;
  document.getElementById('join').onclick = async () => {
    try {
      if (!me) await ensureUser(document.getElementById('name').value);
      const r = await api('POST', `/api/invites/${code}/join`);
      go('/g/' + r.group.id);
    } catch (e) { document.getElementById('err').textContent = e.message; }
  };
}

// ---------- 畫圖題 ----------
// 筆畫格式：{c: 顏色編號, w: 粗細(1|2), p: [x1, y1, x2, y2, ...]}，座標 0–1000，畫布 1000×700
const COLORS = ['#1c1c1f', '#e63836', '#2178f2', '#2ea85c', '#fa9917', '#9457db'];
const MAX_POINTS = 3500;
let DV = [];          // 這次畫面要顯示的作品
const PADS = {};      // 各題作畫中的狀態

function paint(canvas, strokes) {
  const ctx = canvas.getContext('2d');
  const sx = canvas.width / 1000, sy = canvas.height / 700;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const s of strokes) {
    const pts = [];
    for (let i = 0; i + 1 < s.p.length; i += 2) pts.push([s.p[i] * sx, s.p[i + 1] * sy]);
    if (!pts.length) continue;
    ctx.strokeStyle = COLORS[s.c] || COLORS[0];
    ctx.lineWidth = (s.w === 2 ? 0.024 : 0.009) * canvas.width;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    if (pts.length === 1) ctx.lineTo(pts[0][0], pts[0][1]);
    for (let k = 1; k < pts.length; k++) {
      ctx.quadraticCurveTo(pts[k - 1][0], pts[k - 1][1], (pts[k - 1][0] + pts[k][0]) / 2, (pts[k - 1][1] + pts[k][1]) / 2);
    }
    if (pts.length > 1) ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
    ctx.stroke();
  }
}

function setupPad(canvas, send) {
  const qid = +canvas.dataset.pad;
  const st = PADS[qid] = PADS[qid] || { strokes: [], color: 0, w: 1 };
  const box = canvas.closest('.card');
  const count = () => st.strokes.reduce((a, s) => a + s.p.length / 2, 0);
  const sync = () => {
    paint(canvas, st.strokes);
    box.querySelectorAll('[data-color]').forEach(b => b.classList.toggle('on', +b.dataset.color === st.color));
    box.querySelectorAll('[data-width]').forEach(b => b.classList.toggle('on', +b.dataset.width === st.w));
    box.querySelector('[data-draw]').disabled = !st.strokes.length;
  };
  const at = e => {
    const r = canvas.getBoundingClientRect();
    return [Math.round(Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1) * 1000),
            Math.round(Math.min(Math.max((e.clientY - r.top) / r.height, 0), 1) * 700)];
  };
  let cur = null;
  canvas.onpointerdown = e => {
    if (count() >= MAX_POINTS) return;
    canvas.setPointerCapture(e.pointerId);
    cur = { c: st.color, w: st.w, p: at(e) };
    st.strokes.push(cur); sync();
  };
  canvas.onpointermove = e => {
    if (!cur || count() >= MAX_POINTS) return;
    const [x, y] = at(e), n = cur.p.length;
    const dx = x - cur.p[n - 2], dy = y - cur.p[n - 1];
    if (dx * dx + dy * dy < 16) return;       // 移動太短就不記，減少資料量
    cur.p.push(x, y); paint(canvas, st.strokes);
  };
  canvas.onpointerup = canvas.onpointercancel = () => { cur = null; };
  box.querySelectorAll('[data-color]').forEach(b => b.onclick = () => { st.color = +b.dataset.color; sync(); });
  box.querySelectorAll('[data-width]').forEach(b => b.onclick = () => { st.w = +b.dataset.width; sync(); });
  box.querySelector('[data-undo]').onclick = () => { st.strokes.pop(); sync(); };
  box.querySelector('[data-clear]').onclick = () => { st.strokes = []; sync(); };
  box.querySelector('[data-draw]').onclick = () => { if (st.strokes.length) { send(qid, st.strokes); delete PADS[qid]; } };
  sync();
}

// ---------- 群組頁 ----------
let tab = 'open';

async function renderGroup(gid) {
  let data;
  try { data = await api('GET', '/api/groups/' + gid); }
  catch (e) { $app.innerHTML = `${topBar()}<div class="card">${esc(e.message)}</div>`; return; }
  const { group: g, questions } = data;
  const open = questions.filter(q => !q.closed);
  const closed = questions.filter(q => q.closed);
  const list = tab === 'open' ? open : closed;
  DV = [];

  $app.innerHTML = `${topBar()}
    <h1>${esc(g.name)}</h1>
    <p class="muted" style="margin-top:0">${g.member_count} 位成員 · 答案匿名 · ≥3 人回答才公開結果</p>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <span>邀請碼 <b class="invite">${esc(g.invite_code)}</b></span>
        <span class="row"><button class="secondary" id="copy">複製邀請連結</button>
        <button class="ghost" id="mute">${g.muted ? '取消靜音' : '靜音'}</button></span>
      </div>
    </div>

    <h2>出題</h2>
    <div class="card" id="ask">
      <div class="row" style="flex-wrap:nowrap;margin-bottom:10px">
        <select id="kind" style="width:auto">
          <option value="choice">單選</option><option value="multi">多選</option>
          <option value="scale">評分 1–5</option><option value="text">文字回答</option>
          <option value="draw">畫圖</option></select>
        <input id="qtext" maxlength="120" placeholder="想問大家什麼？例如：中午吃什麼？">
      </div>
      <div class="opts-edit" id="opts"></div>
      <div class="row" id="scale-labels" style="flex-wrap:nowrap;margin-bottom:8px;display:none">
        <input id="low" maxlength="12" placeholder="1 分代表…"><input id="high" maxlength="12" placeholder="5 分代表…"></div>
      <label class="check"><input type="checkbox" id="anon" checked> 匿名（滿 3 人回答才顯示結果；不勾就是具名）</label>
      <label class="check"><input type="checkbox" id="live"> 回答後立刻看到結果（不勾就是截止才開獎）</label>
      <div class="row" style="justify-content:space-between;margin-top:8px">
        <button class="ghost" id="addopt">＋ 新增選項</button>
        <span class="row"><select id="hours" style="width:auto">
          <option value="0.5">30 分鐘後截止</option><option value="1">1 小時後截止</option>
          <option value="4">4 小時後截止</option><option value="24" selected>1 天後截止</option>
          <option value="72">3 天後截止</option></select>
        <button id="send">發問</button></span>
      </div>
      <div class="error" id="err"></div>
    </div>

    <div class="tabs">
      <button data-tab="open" class="${tab === 'open' ? 'on' : ''}">進行中（${open.length}）</button>
      <button data-tab="closed" class="${tab === 'closed' ? 'on' : ''}">已開獎（${closed.length}）</button>
    </div>
    ${list.length ? list.map(questionCard).join('') : `<p class="muted">${tab === 'open' ? '目前沒有進行中的題目。' : '還沒有開獎的題目。'}</p>`}`;

  // 選項編輯器：2–4 個
  let opts = ['', ''];
  const drawOpts = () => {
    document.getElementById('opts').innerHTML = opts.map((o, i) => `<div class="row">
        <input data-opt="${i}" maxlength="40" placeholder="選項 ${i + 1}" value="${esc(o)}">
        ${opts.length > 2 ? `<button class="ghost" data-del="${i}" aria-label="刪除">✕</button>` : ''}</div>`).join('');
    document.getElementById('addopt').disabled = opts.length >= 6;
  };
  drawOpts();
  const kindSel = document.getElementById('kind');
  const syncKind = () => {
    const hasOpts = kindSel.value === 'choice' || kindSel.value === 'multi';
    document.getElementById('opts').style.display = hasOpts ? '' : 'none';
    document.getElementById('addopt').style.visibility = hasOpts ? 'visible' : 'hidden';
    document.getElementById('scale-labels').style.display = kindSel.value === 'scale' ? 'flex' : 'none';
  };
  kindSel.onchange = syncKind; syncKind();
  document.getElementById('opts').oninput = e => { if (e.target.dataset.opt) opts[+e.target.dataset.opt] = e.target.value; };
  document.getElementById('opts').onclick = e => { const d = e.target.dataset.del; if (d !== undefined) { opts.splice(+d, 1); drawOpts(); } };
  document.getElementById('addopt').onclick = () => { if (opts.length < 6) { opts.push(''); drawOpts(); } };
  document.getElementById('send').onclick = async () => {
    try {
      await api('POST', `/api/groups/${gid}/questions`, {
        text: document.getElementById('qtext').value,
        kind: kindSel.value,
        options: opts.map(o => o.trim()).filter(Boolean),
        config: { low: document.getElementById('low').value.trim(), high: document.getElementById('high').value.trim() },
        anonymous: document.getElementById('anon').checked,
        live: document.getElementById('live').checked,
        hours: +document.getElementById('hours').value,
      });
      tab = 'open'; renderGroup(gid);
    } catch (e) { document.getElementById('err').textContent = e.message; }
  };

  document.getElementById('copy').onclick = async e => {
    try { await navigator.clipboard.writeText(g.invite_url); e.target.textContent = '已複製 ✓'; }
    catch { prompt('複製這個連結：', g.invite_url); }
  };
  document.getElementById('mute').onclick = async () => {
    await api('POST', `/api/groups/${gid}/mute`, { muted: !g.muted }); renderGroup(gid);
  };
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; renderGroup(gid); });
  const send = async (qid, answer) => {
    try { await api('POST', `/api/questions/${qid}/vote`, { answer }); renderGroup(gid); }
    catch (e) { alert(e.message); renderGroup(gid); }
  };
  document.querySelectorAll('[data-vote]').forEach(b => b.onclick = () => {
    const [qid, opt] = b.dataset.vote.split(':').map(Number); send(qid, opt);
  });
  document.querySelectorAll('[data-multi]').forEach(b => b.onclick = () => {
    const qid = +b.dataset.multi;
    const picked = [...document.querySelectorAll(`[data-pick="${qid}"]:checked`)].map(c => +c.value);
    if (picked.length) send(qid, picked); else alert('請至少選一個選項');
  });
  document.querySelectorAll('canvas[data-dv]').forEach(c => paint(c, DV[+c.dataset.dv]));
  document.querySelectorAll('canvas[data-pad]').forEach(c => setupPad(c, send));
  document.querySelectorAll('[data-text]').forEach(b => b.onclick = () => {
    const qid = +b.dataset.text;
    const v = document.getElementById('text-' + qid).value.trim();
    if (v) send(qid, v);
  });
}

// 各題型的作答區
function answerHtml(q, kind, scaleLabels) {
  if (kind === 'multi') {
    return q.options.map((o, i) => `<label class="check opt" style="padding:9px 12px;border-radius:10px">
        <input type="checkbox" data-pick="${q.id}" value="${i}"> <span style="color:var(--text)">${esc(o)}</span></label>`).join('')
      + `<button style="margin-top:8px" data-multi="${q.id}">送出</button>`;
  }
  if (kind === 'scale') {
    return `<div class="scale">${[0, 1, 2, 3, 4].map(i => `<button class="opt" data-vote="${q.id}:${i}">${i + 1}</button>`).join('')}</div>` + scaleLabels;
  }
  if (kind === 'draw') {
    return `<canvas class="pad" width="1000" height="700" data-pad="${q.id}"></canvas>
      <div class="tools">${COLORS.map((c, i) => `<button class="dot" data-color="${i}" style="background:${c}" aria-label="顏色 ${i + 1}"></button>`).join('')}
        <span style="flex:1"></span>
        <button class="ghost" data-width="1">細</button><button class="ghost" data-width="2">粗</button>
        <button class="ghost" data-undo>復原</button><button class="ghost" data-clear>清除</button></div>
      <button data-draw="${q.id}">送出這張畫</button>`;
  }
  if (kind === 'text') {
    return `<textarea id="text-${q.id}" maxlength="140" placeholder="寫下你的回答（最多 140 字）"></textarea>
      <button style="margin-top:8px" data-text="${q.id}">送出</button>`;
  }
  return q.options.map((o, i) => `<button class="opt" data-vote="${q.id}:${i}">${esc(o)}</button>`).join('');
}

function questionCard(q) {
  const kind = q.kind || 'choice';
  const meta = `<div class="q-meta">${esc(q.author_name)} 出題 · ${q.answered_count}／${q.member_count} 人已答 · ${q.closed ? '已開獎' : timeLeft(q.closes_at)}</div>`;
  const privacy = q.anonymous === false
    ? `<p class="faint named" style="margin:8px 0 0">具名 · 大家會看到你的回答${q.live ? ' · 回答後立刻看結果' : ''}</p>`
    : `<p class="faint" style="margin:8px 0 0">匿名 · ≥3 人回答才公開${q.live ? ' · 回答後立刻看結果' : ''}</p>`;
  const scaleLabels = (q.scale_low || q.scale_high)
    ? `<div class="row faint" style="justify-content:space-between"><span>${q.scale_low ? '1 = ' + esc(q.scale_low) : ''}</span><span>${q.scale_high ? '5 = ' + esc(q.scale_high) : ''}</span></div>` : '';
  // 結果（看得到的話）
  let body = null;
  if (q.drawings) {
    body = `<div class="gallery ${q.drawings.length === 1 ? 'one' : ''}">` + q.drawings.map(d => {
      DV.push(d.strokes);
      return `<div><canvas class="dv" width="600" height="420" data-dv="${DV.length - 1}"></canvas>${d.name ? `<div class="faint">${esc(d.name)}</div>` : ''}</div>`;
    }).join('') + '</div>';
  } else if (q.texts) {
    body = q.texts.map(t => `<div class="answer">${esc(t.text)}${t.name ? `<div class="faint">${esc(t.name)}</div>` : ''}</div>`).join('');
  } else if (q.results) {
    const votes = q.results.reduce((a, b) => a + b, 0);
    const total = (kind === 'multi' ? q.answered_count : votes) || 1;   // 多選題以回答人數為分母
    const mine = i => i === q.my_vote || (q.my_votes || []).includes(i);
    body = '';
    if (kind === 'scale') {
      const sum = q.results.reduce((a, n, i) => a + n * (i + 1), 0);
      body += `<div style="font-weight:700;font-size:18px">平均 ${(sum / (votes || 1)).toFixed(1)} 分</div>${scaleLabels}`;
    }
    body += q.options.map((o, i) => {
      const pct = Math.round(q.results[i] / total * 100);
      const names = q.voters && q.voters[i].length ? `<div class="voters">${q.voters[i].map(esc).join('、')}</div>` : '';
      return `<div class="row" style="justify-content:space-between"><span>${kind === 'scale' ? (i + 1) + ' 分' : esc(o)}${mine(i) ? '（你）' : ''}</span>
        <span class="muted">${pct}% · ${q.results[i]} 票</span></div>
        <div class="bar ${mine(i) ? 'mine' : ''}"><i style="width:${Math.min(pct, 100)}%"></i></div>${names}`;
    }).join('');
  }
  const resultsHtml = body;

  // 還沒回答就一定先顯示作答區。出題者自己也要能回答：
  // 即時題的出題者可以提前看結果，但結果放在作答區下面，不能把作答區蓋掉
  if (!q.closed && !q.my_answered) {
    body = answerHtml(q, kind, scaleLabels) + privacy;
    if (resultsHtml && q.answered_count > 0) body += `<p class="faint" style="margin:14px 0 6px">目前的回答</p>` + resultsHtml;
  } else if (!resultsHtml) {
    body = q.closed ? `<p class="muted">${esc(q.hidden_reason || '結果未公開')}</p>`
                    : `<p class="badge done">✓ 已回答 · ${esc(q.hidden_reason || '開獎時公布結果')}</p>`;
  }
  return `<div class="card">${meta}<div class="q-text">${esc(q.text)}</div>${body}</div>`;
}

render().catch(e => { $app.innerHTML = `<div class="card">載入失敗：${esc(e.message)}</div>`; });
</script>
</body>
</html>
